# yaml-language-server: $schema=https://docs.ludus.cloud/schemas/range-config.json

ludus:

  # Windows Server 2022 - Active Directory Domain Controller
  - vm_name: "{{ range_id }}-DC01"
    hostname: "DC01"
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 10
    ram_gb: 8
    cpus: 2

    windows:
      sysprep: false

    domain:
      fqdn: ccdc.hive
      role: primary-dc

  # Debian 12 - Web Server
  - vm_name: "{{ range_id }}-WEB01"
    hostname: "WEB01"
    template: debian-12-x64-server-template
    vlan: 10
    ip_last_octet: 20
    ram_gb: 4
    cpus: 2

    linux: true

    roles:
      - web-server

  # Windows 11 - Client Workstation
  - vm_name: "{{ range_id }}-WIN11"
    hostname: "WIN11"
    template: win11-22h2-x64-enterprise-template
    vlan: 10
    ip_last_octet: 30
    ram_gb: 8
    cpus: 2

    windows:
      sysprep: true

    domain:
      fqdn: ccdc.hive
      role: member
